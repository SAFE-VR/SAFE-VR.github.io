---
layout: default
---

<section class="page-header">
  <div class="container container-narrow">
    {% if page.parent_url %}
      <a href="{{ page.parent_url | relative_url }}" class="back-link">← {{ page.back_text | default: "Back" }}</a>
    {% endif %}
    {% if page.meta %}
      <p class="eyebrow">{{ page.meta }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.summary %}
      <p class="page-lead">{{ page.summary }}</p>
    {% endif %}
  </div>
</section>

<section class="section section-tight">
  <article class="container container-narrow prose">
    {{ content }}
  </article>
</section>
